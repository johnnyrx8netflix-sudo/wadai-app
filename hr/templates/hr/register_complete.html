<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録完了 | wadai</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            max-width: 480px;
            background: #fff;
            padding: 32px 24px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h1 { font-size: 1.3rem; color: #2b6cb0; margin-bottom: 12px; }
        p { color: #555; font-size: 0.95rem; line-height: 1.6; }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #2b6cb0;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>ご登録ありがとうございました</h1>
        <p>スタッフ情報およびスキルシートの登録が完了しました。<br>担当者より折り返しご連絡いたします。</p>
        <a href="/register/">続けて別のスタッフを登録する</a>
    </div>
</body>
</html>
