<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スキルシート登録 / Skill Sheet</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; background: #f7f8fa; color: #222; }
    .card { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h1 { font-size: 1.4rem; margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.92rem; }
    input, select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #1d4ed8; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1e40af; }
    .notice { background: #ecfdf5; border: 1px solid #10b981; color: #065f46; padding: 14px; border-radius: 6px; margin-bottom: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>スキルシート入力フォーム / Skill Sheet Application</h1>

    {% if submitted %}
      <div class="notice">
        登録が完了しました。ご入力ありがとうございます。<br>
        Cadastro concluído com sucesso. Obrigado!
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="field">
          {{ field.label_tag }}
          {{ field }}
          {% if field.errors %}
            <div style="color: #b91c1c; font-size: 0.85rem;">{{ field.errors }}</div>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit">送信する / Enviar / Submit</button>
    </form>
  </div>
</body>
</html>
